name: Build source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mkdir -p build && javac -d build backend/FoodService.java backend/WebServer.java backend/tests/Phase2Test.java
      - run: node --check frontend/app.js
