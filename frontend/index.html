<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Delivery System</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#">FOOD DELIVERY</a><nav><button data-view="browse" class="active">Restaurants</button><button data-view="orders">My orders <b id="order-count">0</b></button><button data-view="kitchen">Kitchen</button><button data-view="delivery">Deliveries</button></nav><div class="header-right"><span id="connection" class="connection">Connecting…</span><label>Demo customer <select id="customer" aria-label="Demo customer"></select></label></div></header>
<main id="main"></main><footer><span>BACSE202 · Phase 2 · Food Delivery System</span><button id="refresh">Refresh database</button></footer>
<dialog id="checkout"><form id="checkout-form"><div class="dialog-heading"><h2>Delivery details</h2><button type="button" class="close" aria-label="Close checkout">×</button></div><p class="muted">Check your order and enter the delivery address.</p><label>Delivery address<input name="address" required maxlength="200" placeholder="Building, block and gate"></label><div class="form-row"><label>City<input name="city" required maxlength="80" value="Chennai"></label><label>Postal code<input name="postal" required maxlength="12" placeholder="600001"></label></div><label>Payment method<select name="method"><option value="CASH">Cash on delivery</option><option value="ONLINE">Online — simulated payment</option></select></label><div id="checkout-summary"></div><p class="fine">This project records simulated payments. It does not process real payments.</p><button type="submit" class="primary full">Place order</button></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
